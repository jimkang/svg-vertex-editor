<!DOCTYPE html>
<html>
  <head>
    <title>Enmeaten editor</title>
    <link rel="stylesheet" href="app.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="status-message" class="hidden"></div>

    <h1 class="title">
      Enmeaten editor
    </h1>

    <main>
      <section>
        <h3>Board</h3>

        <svg id="board" width="1000" height="1000">
          <g id="zoom-root">
            <g id="svg-contents"></g>
            <path id="meat"></path>
            <path id="bones"></path>
            <g id="vertices"></g>
          </g>
        </svg>

      </section>

      <section>
        <h3>Numbers</h3>

        <h4>Vertices JSON</h4>
        <textarea id="json-area" rows="16"></textarea>
        <input type="checkbox" id="xy-mode-checkbox" checked>
        <label for="xy-mode-checkbox">Format points as x-y objects instead of two-element arrays</label>
        <br><br>
        <h4>SVG bbox</h4>
        <div id="svg-bbox-field"></div>
        <h4>Vertices bbox</h4>
        <div id="vertices-bbox-field"></div>
        <h4>Vertices offsets</h4>
        <textarea id="vertices-offsets-field" rows="4"></textarea>
        <h4>Path (coordinate pairs, not SVG paths)</h4>
      <input id="path-field"></input>
      </section>
    </main>

    <div class="control-bar">
      <div id="file-load-section">
        <label for="svg-file">Load an SVG file</label>
        <input type="file" id="svg-file" accept="image/svg+xml" />
        <br><br>
        <label >Load a def file</label>
        <input type="file" id="def-file" accept="text" />
      </div>
      <label for="enmeaten-curve-fn">Enmeaten curve function</label>
      <select id="enmeaten-curve-fn"></select>
      <label for="enmeaten-roundness-slider">Extra roundness</label>
      <input id="enmeaten-roundness-slider" type="range" value="0"></input>
      <label for="enmeaten-seed-text">Random seed</label>
      <input id="enmeaten-seed-text" type="text" value=""></input>
      <button id="add-mode-toggle"></button>
      <button id="delete-mode-toggle"></button>
      <button id="load-vertices-button">Load vertices from text</button>
      <button id="move-vertices-button">Move vertices to upper left</button>

      <div id="point-details">
        <h3>Point details</h3>
        <h4>x</h4>
        <input class="point-detail-x" type="number"></input>
        <h4>y</h4>
        <input class="point-detail-y" type="number"></input>
        <div>
          <label for="point-detail-sharpen">Is a sharpen point?</label>
          <input type="checkbox" id="point-detail-sharpen"></input>
        </div>
      </div>
    </div>


    <div id="version-info"></div>

    <script src="index.js"></script>
  </body>
</html>
